services:

  postgres:
    image: postgres:16

    container_name: altoque-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: altoque
      POSTGRES_PASSWORD: altoque
      POSTGRES_DB: altoque

    ports:
      - "5432:5432"

    volumes:
      - altoque_postgres_data:/var/lib/postgresql/data


volumes:
  altoque_postgres_data: